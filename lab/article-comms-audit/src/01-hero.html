<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Hero</title>
<style>
:root{--navy:#0D172A;--navy2:#16284A;--navy3:#2B4A86;--gold:#F2B720;--cream:#FBF6EA;--mist:#C9D1E2}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:627px;overflow:hidden;background:var(--navy)}
body{position:relative;font-family:Bahnschrift,'Segoe UI',Arial,sans-serif;color:#fff}
.bg{position:absolute;inset:0}
.copy{position:absolute;left:64px;top:92px;width:610px}
.eyebrow{font-size:16px;letter-spacing:.24em;font-weight:600;color:var(--gold);text-transform:uppercase}
h1{margin-top:20px;font-size:50px;line-height:1.06;font-weight:700;letter-spacing:-.005em}
h1 em{display:block;margin-top:10px;font-style:normal;color:var(--gold)}
.sub{margin-top:24px;font-size:20px;line-height:1.45;color:var(--mist);max-width:480px}
.badge{position:absolute;left:64px;bottom:42px;display:flex;align-items:center;gap:14px}
.badge img{width:62px;height:62px;border-radius:14px;background:#F2F2F0}
.badge span{font-size:14px;letter-spacing:.16em;color:#9FB0D0;text-transform:uppercase;line-height:1.5}
.art{position:absolute;right:0;top:0}
.chip{font:600 13px Bahnschrift,'Segoe UI',sans-serif;letter-spacing:.14em}
</style></head><body>
<svg class="bg" width="1200" height="627" viewBox="0 0 1200 627">
  <defs>
    <radialGradient id="glow" cx="82%" cy="40%" r="60%"><stop offset="0" stop-color="#1D3563" stop-opacity=".9"/><stop offset="1" stop-color="#0D172A" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="627" fill="url(#glow)"/>
  <g stroke="#F2B720" stroke-opacity=".10" stroke-width="2" stroke-linecap="round">
    <line x1="1130" y1="-30" x2="760" y2="130"/><line x1="1130" y1="-30" x2="800" y2="40"/>
    <line x1="1130" y1="-30" x2="900" y2="250"/><line x1="1130" y1="-30" x2="1010" y2="330"/>
    <line x1="1130" y1="-30" x2="1180" y2="330"/><line x1="1130" y1="-30" x2="700" y2="-10"/>
  </g>
</svg>

<div class="copy">
  <div class="eyebrow">Communications audit</div>
  <h1>I audited my own LinkedIn.<em>It said I was talking to the wrong people.</em></h1>
  <p class="sub">What the audit found, and a 30-minute version you can run today.</p>
</div>

<div class="badge"><img src="assets/speakpower-logo.png" alt="SpeakPower"><span>Thomas Otieno<br>SpeakPower, Kampala</span></div>

<svg class="art" width="600" height="627" viewBox="0 0 600 627">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="150%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".38"/></filter>
    <clipPath id="clipA"><rect width="190" height="250" rx="12"/></clipPath>
    <clipPath id="clipB"><rect width="190" height="262" rx="12"/></clipPath>
    <clipPath id="clipC"><rect width="236" height="156" rx="12"/></clipPath>
  </defs>

  <!-- Card A: website -->
  <g transform="translate(70,232) rotate(-8 95 125)" filter="url(#sh)">
    <rect width="190" height="250" rx="12" fill="#FBF6EA"/>
    <g clip-path="url(#clipA)">
      <rect width="190" height="30" fill="#16284A"/>
      <circle cx="16" cy="15" r="4" fill="#F2B720"/><circle cx="30" cy="15" r="4" fill="#9FB0D0"/><circle cx="44" cy="15" r="4" fill="#9FB0D0"/>
      <rect x="14" y="44" width="162" height="76" rx="8" fill="#F2B720"/>
      <rect x="28" y="62" width="88" height="10" rx="5" fill="#0D172A"/>
      <rect x="28" y="80" width="62" height="7" rx="3.5" fill="#0D172A" opacity=".55"/>
      <rect x="14" y="136" width="120" height="9" rx="4.5" fill="#16284A"/>
      <rect x="14" y="154" width="150" height="6" rx="3" fill="#B9C0D0"/>
      <rect x="14" y="166" width="108" height="6" rx="3" fill="#B9C0D0"/>
      <rect x="14" y="196" width="64" height="22" rx="11" fill="#16284A"/>
    </g>
  </g>

  <!-- Card B: LinkedIn profile -->
  <g transform="translate(250,118) rotate(3 95 131)" filter="url(#sh)">
    <rect width="190" height="262" rx="12" fill="#FBF6EA"/>
    <g clip-path="url(#clipB)">
      <rect width="190" height="64" fill="#2B4A86"/>
      <circle cx="44" cy="68" r="28" fill="#FBF6EA"/><circle cx="44" cy="68" r="23" fill="#F2B720"/>
      <rect x="16" y="108" width="104" height="11" rx="5.5" fill="#16284A"/>
      <rect x="16" y="127" width="156" height="6" rx="3" fill="#B9C0D0"/>
      <rect x="16" y="139" width="128" height="6" rx="3" fill="#B9C0D0"/>
      <rect x="16" y="151" width="142" height="6" rx="3" fill="#B9C0D0"/>
      <rect x="16" y="176" width="70" height="22" rx="11" fill="#16284A"/>
      <rect x="94" y="176" width="70" height="22" rx="11" fill="none" stroke="#16284A" stroke-width="2"/>
      <rect x="16" y="216" width="46" height="26" rx="6" fill="#E7EAF2"/><rect x="72" y="216" width="46" height="26" rx="6" fill="#E7EAF2"/><rect x="128" y="216" width="46" height="26" rx="6" fill="#E7EAF2"/>
    </g>
    <!-- highlighter swipe on the headline lines -->
    <rect x="10" y="123" width="170" height="38" rx="4" fill="#F2B720" opacity=".42"/>
  </g>

  <!-- Card C: deck slide -->
  <g transform="translate(330,372) rotate(-4 118 78)" filter="url(#sh)">
    <rect width="236" height="156" rx="12" fill="#FBF6EA"/>
    <g clip-path="url(#clipC)">
      <rect width="236" height="8" fill="#F2B720"/>
      <rect x="18" y="24" width="124" height="11" rx="5.5" fill="#16284A"/>
      <rect x="18" y="44" width="90" height="6" rx="3" fill="#B9C0D0"/>
      <rect x="18" y="56" width="104" height="6" rx="3" fill="#B9C0D0"/>
      <rect x="18" y="68" width="76" height="6" rx="3" fill="#B9C0D0"/>
      <rect x="140" y="82" width="16" height="44" rx="3" fill="#2B4A86"/>
      <rect x="164" y="64" width="16" height="62" rx="3" fill="#F2B720"/>
      <rect x="188" y="94" width="16" height="32" rx="3" fill="#2B4A86"/>
      <rect x="132" y="128" width="84" height="3" rx="1.5" fill="#16284A" opacity=".5"/>
      <text x="206" y="146" font-family="Bahnschrift,Segoe UI,sans-serif" font-size="10" fill="#8A93A6">3</text>
    </g>
  </g>

  <!-- labels -->
  <g class="chip" fill="#F2B720">
    <text x="64" y="528">WEBSITE</text>
    <text x="268" y="98">LINKEDIN</text>
    <text x="336" y="566">PITCH DECK</text>
  </g>
</svg>
</body></html>
