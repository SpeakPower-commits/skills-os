<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Hero</title>
<style>
:root{--navy:#0D172A;--gold:#F2B720;--paper:#F6EEDB;--red:#D64045}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:627px;overflow:hidden;background:var(--gold)}
body{position:relative;color:var(--navy);font-family:Georgia,'Times New Roman',serif}
.hand{font-family:'Ink Free','Segoe Print',cursive}
.copy{position:absolute;left:64px;top:78px;width:620px}
.eyebrow{font-size:30px;color:var(--navy);transform:rotate(-2deg);display:inline-block;border-bottom:4px solid var(--navy);padding-bottom:2px}
h1{margin-top:26px;font-size:60px;line-height:1.04;font-weight:700;letter-spacing:-.01em}
h1 em{display:block;margin-top:16px;font-style:italic;font-weight:400;font-size:44px;line-height:1.12}
.sub{margin-top:30px;font-size:21px;line-height:1.45;max-width:500px;font-style:italic}
.badge{position:absolute;left:64px;bottom:40px;display:flex;align-items:center;gap:14px;font-family:'Segoe UI',Arial,sans-serif}
.badge img{width:58px;height:58px;border-radius:12px;background:#F2F2F0}
.badge span{font-size:14px;letter-spacing:.14em;text-transform:uppercase;line-height:1.5;color:#3A2E05}
.desk{position:absolute;right:0;top:0;width:470px;height:627px;background:var(--navy)}
</style></head><body>
<div class="desk"></div>
<div class="copy">
  <div class="eyebrow hand">NGO storytelling</div>
  <h1>Everyone says lead with one story.<em>The evidence is shakier than that.</em></h1>
  <p class="sub">What a 2023 repeat of the famous experiment found, and a one-page funder story that holds up.</p>
</div>
<div class="badge"><img src="assets/speakpower-logo.png" alt="SpeakPower"><span>Thomas Otieno<br>SpeakPower, Kampala</span></div>

<svg style="position:absolute;right:0;top:0" width="640" height="627" viewBox="0 0 640 627">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="150%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".45"/></filter>
  </defs>
  <!-- paper page -->
  <g transform="translate(250,70) rotate(-4 170 230)" filter="url(#sh)">
    <rect width="340" height="470" rx="6" fill="#F6EEDB"/>
    <g stroke="#C9BFA6" stroke-width="1.5">
      <line x1="26" y1="92" x2="314" y2="92"/><line x1="26" y1="126" x2="314" y2="126"/><line x1="26" y1="160" x2="314" y2="160"/>
      <line x1="26" y1="194" x2="314" y2="194"/><line x1="26" y1="228" x2="314" y2="228"/><line x1="26" y1="262" x2="314" y2="262"/>
      <line x1="26" y1="296" x2="314" y2="296"/><line x1="26" y1="330" x2="314" y2="330"/><line x1="26" y1="364" x2="314" y2="364"/><line x1="26" y1="398" x2="314" y2="398"/>
    </g>
    <line x1="52" y1="0" x2="52" y2="470" stroke="#E7A3A3" stroke-width="2"/>
    <text x="70" y="64" font-family="Georgia,serif" font-weight="700" font-size="26" fill="#0D172A">Funding proposal</text>
    <text x="70" y="118" font-family="Ink Free,Segoe Print,cursive" font-size="27" fill="#0D172A">Lead with ONE story.</text>
    <text x="70" y="152" font-family="Ink Free,Segoe Print,cursive" font-size="27" fill="#0D172A">Never use numbers.</text>
    <text x="70" y="186" font-family="Ink Free,Segoe Print,cursive" font-size="27" fill="#0D172A">(Everyone says so.)</text>
    <!-- red pen circle and arrow -->
    <ellipse cx="164" cy="114" rx="104" ry="22" fill="none" stroke="#D64045" stroke-width="4" transform="rotate(-2 164 114)"/>
    <path d="M268 112 C 300 100, 318 84, 330 60" fill="none" stroke="#D64045" stroke-width="4" stroke-linecap="round"/>
    <path d="M318 58 L332 56 L330 72" fill="none" stroke="#D64045" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="196" y="300" font-family="Ink Free,Segoe Print,cursive" font-size="40" fill="#D64045" transform="rotate(-6 196 300)" textLength="130" lengthAdjust="spacingAndGlyphs">says who?</text>
    <!-- scribble underline -->
    <path d="M70 330 q20 -10 40 0 t40 0 t40 0 t40 0" fill="none" stroke="#D64045" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- sticky note -->
  <g transform="translate(60,360) rotate(7 80 80)" filter="url(#sh)">
    <rect width="170" height="170" fill="#F2B720"/>
    <rect width="170" height="22" fill="#E2A60F"/>
    <text x="22" y="86" font-family="Ink Free,Segoe Print,cursive" font-size="30" fill="#0D172A">What did</text>
    <text x="22" y="124" font-family="Ink Free,Segoe Print,cursive" font-size="30" fill="#0D172A">they test?</text>
  </g>

  <!-- paperclip -->
  <path d="M520 58 v-40 a14 14 0 0 1 28 0 v70 a22 22 0 0 1 -44 0 v-60" fill="none" stroke="#C9D1E2" stroke-width="5" stroke-linecap="round" transform="translate(-40,10)"/>
</svg>
</body></html>
