<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Hero</title>
<style>
:root{--navy:#0D172A;--navy2:#16284A;--gold:#F2B720;--cream:#FBF6EA;--mist:#C9D1E2}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:627px;overflow:hidden;background:var(--navy)}
body{position:relative;font-family:Bahnschrift,'Segoe UI',Arial,sans-serif;color:#fff}
.bg{position:absolute;inset:0}
.copy{position:absolute;left:64px;top:92px;width:600px}
.eyebrow{font-size:16px;letter-spacing:.24em;font-weight:600;color:var(--gold);text-transform:uppercase}
h1{margin-top:20px;font-size:50px;line-height:1.06;font-weight:700;letter-spacing:-.005em}
h1 em{display:block;margin-top:10px;font-style:normal;color:var(--gold)}
.sub{margin-top:24px;font-size:20px;line-height:1.45;color:var(--mist);max-width:480px}
.badge{position:absolute;left:64px;bottom:42px;display:flex;align-items:center;gap:14px}
.badge img{width:62px;height:62px;border-radius:14px;background:#F2F2F0}
.badge span{font-size:14px;letter-spacing:.16em;color:#9FB0D0;text-transform:uppercase;line-height:1.5}
.art{position:absolute;right:0;top:0}
</style></head><body>
<svg class="bg" width="1200" height="627" viewBox="0 0 1200 627">
  <defs><radialGradient id="glow" cx="82%" cy="40%" r="60%"><stop offset="0" stop-color="#1D3563" stop-opacity=".9"/><stop offset="1" stop-color="#0D172A" stop-opacity="0"/></radialGradient></defs>
  <rect width="1200" height="627" fill="url(#glow)"/>
  <g stroke="#F2B720" stroke-opacity=".10" stroke-width="2" stroke-linecap="round">
    <line x1="1130" y1="-30" x2="760" y2="130"/><line x1="1130" y1="-30" x2="900" y2="250"/>
    <line x1="1130" y1="-30" x2="1010" y2="330"/><line x1="1130" y1="-30" x2="1180" y2="330"/><line x1="1130" y1="-30" x2="700" y2="-10"/>
  </g>
</svg>

<div class="copy">
  <div class="eyebrow">NGO storytelling</div>
  <h1>Everyone says lead with one story.<em>The evidence is shakier than that.</em></h1>
  <p class="sub">What a 2023 repeat of the famous experiment found, and a five-part funder story that holds up.</p>
</div>

<div class="badge"><img src="assets/speakpower-logo.png" alt="SpeakPower"><span>Thomas Otieno<br>SpeakPower, Kampala</span></div>

<svg class="art" width="600" height="627" viewBox="0 0 600 627">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="150%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".38"/></filter>
    <clipPath id="clipP"><rect width="210" height="280" rx="12"/></clipPath>
    <clipPath id="clipS"><rect width="220" height="250" rx="12"/></clipPath>
  </defs>

  <!-- person card -->
  <g transform="translate(80,190) rotate(-5 105 140)" filter="url(#sh)">
    <rect width="210" height="280" rx="12" fill="#FBF6EA"/>
    <g clip-path="url(#clipP)">
      <rect width="210" height="70" fill="#2B4A86"/>
      <circle cx="105" cy="76" r="44" fill="#FBF6EA"/><circle cx="105" cy="76" r="37" fill="#F2B720"/>
      <rect x="55" y="140" width="100" height="12" rx="6" fill="#16284A"/>
      <rect x="40" y="166" width="130" height="7" rx="3.5" fill="#B9C0D0"/>
      <rect x="30" y="180" width="150" height="7" rx="3.5" fill="#B9C0D0"/>
      <rect x="48" y="194" width="114" height="7" rx="3.5" fill="#B9C0D0"/>
      <rect x="62" y="226" width="86" height="26" rx="13" fill="#16284A"/>
    </g>
  </g>

  <!-- statistics card -->
  <g transform="translate(335,250) rotate(4 110 125)" filter="url(#sh)">
    <rect width="220" height="250" rx="12" fill="#FBF6EA"/>
    <g clip-path="url(#clipS)">
      <rect width="220" height="8" fill="#F2B720"/>
      <rect x="20" y="28" width="110" height="11" rx="5.5" fill="#16284A"/>
      <rect x="20" y="48" width="84" height="6" rx="3" fill="#B9C0D0"/>
      <rect x="28" y="130" width="22" height="70" rx="3" fill="#2B4A86"/>
      <rect x="62" y="104" width="22" height="96" rx="3" fill="#2B4A86"/>
      <rect x="96" y="148" width="22" height="52" rx="3" fill="#2B4A86"/>
      <rect x="130" y="88" width="22" height="112" rx="3" fill="#2B4A86"/>
      <rect x="164" y="120" width="22" height="80" rx="3" fill="#2B4A86"/>
      <rect x="20" y="204" width="180" height="3" rx="1.5" fill="#16284A" opacity=".5"/>
    </g>
  </g>

  <!-- question mark -->
  <g transform="translate(318,200)">
    <circle r="40" fill="#F2B720"/>
    <text x="0" y="17" text-anchor="middle" font-family="Bahnschrift,Segoe UI,sans-serif" font-weight="700" font-size="54" fill="#0D172A">?</text>
  </g>

  <g fill="#F2B720" font-family="Bahnschrift,Segoe UI,sans-serif" font-weight="600" font-size="13" letter-spacing="2">
    <text x="82" y="520">ONE STORY</text>
    <text x="352" y="560">THE NUMBERS</text>
  </g>
</svg>
</body></html>
